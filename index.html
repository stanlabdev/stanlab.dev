<style>
  :root{
    --bg:#07080d; --bg2:#0e1018; --card:#131622; --line:#23283a; --nav:#07080dcc;
    --blue:#00aaff; --btn-ink:#001522; --text:#e8ecf5; --muted:#8a93a8;
    --violet:#9b6bff; --cyan:#22c3e6; --green:#4fd26b; --orange:#ff9a2e;
    --title:'Press Start 2P',monospace; --head:Inter,system-ui,sans-serif; --bodyf:Inter,system-ui,sans-serif;
    --logo-size:clamp(34px,7vw,78px); --bubble:#00aaff55; --bubble-fill:#00aaff14;
    --free-bg:linear-gradient(135deg,#1a1230,#0c1a24);
  }

  html[data-theme="grimoire"]{--bg:#120d0a;--bg2:#1b140f;--card:#1f1711;--line:#3a2c1f;--nav:#120d0acc;--blue:#e0b05a;--btn-ink:#2a1a05;
    --text:#f3e6d0;--muted:#b59f82;--title:'Cinzel Decorative',serif;--head:'Cinzel',serif;--logo-size:clamp(40px,8vw,96px);
    --bubble:#e0b05a88;--bubble-fill:#e0b05a22;--free-bg:linear-gradient(135deg,#2a1c10,#15100b)}
  html[data-theme="grimoire"] body{background-image:radial-gradient(ellipse at top,#2a1c1066,transparent 60%)}
  html[data-theme="grimoire"] .btn.main{animation:none;box-shadow:0 6px 24px -6px #e0b05a99}
  html[data-theme="grimoire"] .bubble{border-radius:2px;width:6px!important;height:6px!important}
  html[data-theme="dusk"]{--bg:#2a2d44;--bg2:#33364f;--card:#3a3d59;--line:#4d5173;--nav:#2a2d44e0;--blue:#8fb8ff;--btn-ink:#0f1630;
    --text:#eef0fa;--muted:#b6bbd6;--title:'Fredoka',sans-serif;--head:'Fredoka',sans-serif;--logo-size:clamp(52px,10vw,120px);
    --bubble:#8fb8ff66;--bubble-fill:#8fb8ff18;--free-bg:linear-gradient(135deg,#4a3f7a,#2f5a73)}
  html[data-theme="dusk"] body{background-image:radial-gradient(700px 500px at 10% 0%,#6b5bd255,transparent 70%),radial-gradient(700px 500px at 95% 40%,#2fa6c455,transparent 70%)}
  html[data-theme="dusk"] .btn.main{animation:none;box-shadow:0 8px 24px -8px #8fb8ffaa}
  html[data-theme="dusk"] .logo{letter-spacing:1px}
  body{transition:background-color .4s,color .4s}
  .theme{position:relative}
  .theme-btn{display:flex;align-items:center;gap:6px;height:38px;padding:0 10px 0 9px;border-radius:20px;border:1px solid var(--line);
             background:var(--bg2);color:var(--text);cursor:pointer;transition:.2s}
  .theme-btn:hover,.theme.open .theme-btn{border-color:var(--blue)}
  .theme-btn svg{width:20px;height:20px;stroke:var(--blue)}
  .theme .chev{width:12px;height:12px;transition:transform .3s}
  .theme.open .chev{transform:rotate(180deg)}
  .themes{position:absolute;top:48px;right:0;display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:18px;min-width:170px;
          background:var(--bg2);border:1px solid var(--line);box-shadow:0 14px 40px -12px #000a;
          opacity:0;pointer-events:none;transform:translateY(-8px) scale(.96);transform-origin:top right;transition:.25s}
  .theme.open .themes{opacity:1;pointer-events:auto;transform:none}
  .themes button{display:flex;align-items:center;gap:10px;border:1px solid transparent;border-radius:12px;padding:6px 10px 6px 6px;
                 background:transparent;color:var(--text);font:600 14px Inter,sans-serif;cursor:pointer;text-align:left}
  .themes button:hover{background:var(--card)}
  .themes button.on{border-color:var(--blue)}
  .sw{width:26px;height:26px;border-radius:50%;flex:none;border:2px solid #ffffff30}
  .navr{display:flex;align-items:center;gap:8px}

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:var(--bodyf);line-height:1.6;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}

  .mock{position:fixed;bottom:18px;left:18px;background:var(--orange);color:#1a0d00;font:700 11px Inter;letter-spacing:2px;
        padding:6px 12px;border-radius:6px;z-index:99;box-shadow:0 4px 18px #0006}

  nav{position:sticky;top:0;z-index:50;background:var(--nav);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:66px;gap:16px}
  .brand{display:flex;align-items:center;gap:10px;font-family:monospace;color:var(--muted);font-size:14px}
  .brand img{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);transition:transform .5s}
  .brand:hover img{transform:rotate(-20deg)}
  .brand b{color:var(--blue)}
  nav ul{display:flex;gap:24px;list-style:none;font-size:14px;color:var(--muted)}
  nav ul a:hover{color:var(--text)}
  .lang{position:relative}
  .globe{display:flex;align-items:center;gap:6px;height:38px;padding:0 10px 0 8px;border-radius:20px;border:1px solid var(--line);
         background:var(--bg2);color:var(--text);cursor:pointer;transition:.2s}
  .globe:hover,.lang.open .globe{border-color:var(--blue)}
  .globe svg{width:22px;height:22px;stroke:var(--blue)}
  .globe .cur{width:20px;height:20px;border-radius:50%;object-fit:cover}
  .globe .chev{width:12px;height:12px;transition:transform .3s}
  .lang.open .chev{transform:rotate(180deg)}
  .langs{position:absolute;top:48px;right:0;display:flex;flex-direction:column;gap:7px;padding:9px;border-radius:26px;max-height:calc(100vh - 90px);overflow-y:auto;scrollbar-width:none;
         background:var(--bg2);border:1px solid var(--line);box-shadow:0 14px 40px -12px #000a;
         opacity:0;pointer-events:none;transform:translateY(-8px) scale(.96);transform-origin:top right;transition:.25s}
  .lang.open .langs{opacity:1;pointer-events:auto;transform:none}
  .langs button{width:36px;height:36px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer;overflow:hidden;
                background:#0000;transition:transform .2s,border-color .2s;opacity:0;transform:translateY(-10px)}
  .lang.open .langs button{opacity:1;transform:none;transition-delay:calc(var(--n) * 40ms)}
  .langs button img{width:100%;height:100%;object-fit:cover;display:block}
  /* patch_mobile_nav : barre compacte sur téléphone */
  html,body{overflow-x:clip}
  @media (max-width:480px){nav .wrap{gap:8px;padding-left:12px;padding-right:12px}.brand{font-size:11px;gap:6px;white-space:nowrap}.brand img{width:26px;height:26px}.navr{gap:6px}.globe{padding:0 7px 0 6px}}
  .langs button:hover{transform:scale(1.15)!important}
  .langs button.on{border-color:var(--blue);box-shadow:0 0 0 3px #00aaff33}
  /* ---- portail ---- */
  :root{--portal:'Space Grotesk',Inter,sans-serif}
  html[data-theme="grimoire"]{--portal:'Cinzel Decorative',serif}
  html[data-theme="dusk"]{--portal:'Audiowide',sans-serif}
  body{background-image:radial-gradient(900px 500px at 50% -5%, color-mix(in srgb,var(--blue) 22%,transparent), transparent 70%)}
  .marque{font:700 18px var(--portal);color:var(--text);letter-spacing:1px}
  .marque b{color:var(--blue)}
  .hero{text-align:center;padding:90px 0 40px}
  .curseur{display:inline-block;font:600 13px ui-monospace,monospace;letter-spacing:3px;color:var(--blue);
           border:1px solid var(--line);background:var(--bg2);padding:7px 14px;border-radius:30px;margin-bottom:28px;text-transform:uppercase}
  .curseur i{display:inline-block;width:8px;height:14px;background:var(--blue);margin-left:6px;vertical-align:-2px;animation:clig 1s steps(1) infinite}
  @keyframes clig{50%{opacity:0}}
  .titre{font:700 clamp(54px,12vw,140px)/1 var(--portal);letter-spacing:-2px;margin:0;
         background:linear-gradient(180deg,var(--text) 30%,var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;
         filter:drop-shadow(0 8px 40px color-mix(in srgb,var(--blue) 35%,transparent))}
  html[data-theme="grimoire"] .titre{letter-spacing:2px}
  .accroche{font:700 clamp(20px,3vw,30px)/1.35 var(--head);margin:26px auto 14px;max-width:780px}
  .sous{color:var(--muted);font-size:18px;max-width:640px;margin:0 auto 34px}
  .reseaux{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:26px}
  .reseaux a{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--bg2);color:var(--text);transition:.2s}
  .reseaux a svg{width:21px;height:21px;fill:currentColor}
  .reseaux a:hover{color:var(--c);border-color:var(--c);transform:translateY(-3px);box-shadow:0 8px 20px -8px var(--c)}
  .reseaux a.bientot{opacity:.35;cursor:default;pointer-events:none}
  .entrer{display:inline-flex;align-items:center;gap:10px;background:var(--blue);color:var(--btn-ink);font:800 16px Inter,sans-serif;
          padding:14px 26px;border-radius:40px;box-shadow:0 10px 30px -8px var(--blue);transition:.2s}
  .entrer:hover{transform:translateY(-3px)}
  .chiffres{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin:60px auto 0;max-width:900px}
  .chiffres div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 22px;min-width:150px}
  .chiffres b{display:block;font:700 26px var(--portal);color:var(--blue)}
  .chiffres span{color:var(--muted);font-size:14px}
  h2.portes{font:700 14px Inter;letter-spacing:4px;text-transform:uppercase;color:var(--muted);text-align:center;margin:30px 0 26px}
  .grille{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding-bottom:80px;align-items:stretch}
  .porte-icone{font-size:54px;margin-top:22px;opacity:.8}
  .p2{display:flex;flex-direction:column;justify-content:center;border-style:dashed}
  .porte{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px}
  .porte .etat{font:600 12px ui-monospace,monospace;letter-spacing:2px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
  .porte .etat i{width:9px;height:9px;border-radius:50%;background:#555}
  .p1{display:flex;flex-direction:column;gap:18px;background:var(--free-bg);transition:.25s}
  .p1:hover{border-color:var(--blue);transform:translateY(-4px);box-shadow:0 20px 50px -20px var(--blue)}
  .p1 .etat i{background:var(--green);box-shadow:0 0 10px var(--green);animation:pouls 2s infinite}
  @keyframes pouls{50%{box-shadow:0 0 2px var(--green)}}
  .p1 img{height:170px;margin:18px 0 6px;width:auto;max-width:92%;object-fit:contain;align-self:center}   /* 9/11 : les deux logos à la même hauteur, centrés */

  .p1 p{color:var(--text);opacity:.85;font-size:17px;max-width:560px}
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tags span{font:600 13px Inter;border:1px solid var(--line);background:var(--bg2);border-radius:20px;padding:5px 12px;color:var(--muted)}
  .p1 .go{margin-top:auto;align-self:flex-start}
  .porte h3{font:700 22px var(--head);margin:14px 0 6px}
  .porte .txt{color:var(--muted);font-size:15px}
  .p2 .etat i{background:var(--orange)}
  .barre{height:6px;border-radius:6px;background:var(--bg2);margin-top:16px;overflow:hidden}
  .barre i{display:block;height:100%;width:40%;background:var(--orange);border-radius:6px;animation:charge 2.4s ease-in-out infinite}
  @keyframes charge{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  .hc{background:linear-gradient(180deg,#0b0d14cc,#0b0d14f2),url(hc_fond.webp) center/cover}
  .hc .etat i{background:var(--orange);box-shadow:0 0 10px var(--orange)}
  .p3{border-style:dashed}
  .p3 .cadenas{font-size:40px;filter:grayscale(1);opacity:.6}
  footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:14px;text-align:center}
  footer a{color:var(--blue)}
  @media(max-width:760px){.grille{grid-template-columns:1fr}.p1{grid-row:auto}}
</style>
</head>
